  }
  .app{
    position:relative;width:100%;max-width:460px;min-height:100dvh;
    display:flex;flex-direction:column;
    padding:12px 18px calc(16px + env(safe-area-inset-bottom));
  }

  /* ===== 上：店名ロゴ（プレート） ===== */
  .head{flex:0 0 auto;text-align:center}
  .brandcard{
    display:inline-block;background:#fff;
    border:2px solid var(--main);border-radius:14px;
    padding:6px 12px;box-shadow:0 6px 16px color-mix(in srgb,var(--main-d) 18%,transparent);
  }
  .brandlogo{display:block;width:min(226px,60vw);height:auto;max-height:110px;object-fit:contain}
  .brandtext{display:block;padding:4px 10px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:22px;font-weight:700;letter-spacing:.06em;color:var(--ink)}
  .catch{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    margin-top:7px;font-size:12px;line-height:1.5;letter-spacing:.09em;
    color:var(--ink);font-weight:600;
  }

  /* ===== 中：動画（9:16フル表示・切り取りなし） ===== */
  .movie{flex:0 0 auto;margin:10px 0 12px;position:relative}
  .movie video{
    width:100%;height:auto;aspect-ratio:720/1280;object-fit:contain;display:block;
    border-radius:18px;background:#120c06;
    box-shadow:0 14px 34px rgba(0,0,0,.24);
    border:3px solid #fff;outline:1px solid var(--border);
  }
  .mute{
    position:absolute;bottom:12px;right:12px;z-index:3;
    width:38px;height:38px;border:none;border-radius:50%;
    background:rgba(18,12,6,.55);color:#fff;font-size:16px;line-height:38px;text-align:center;
    backdrop-filter:blur(4px);cursor:pointer;
  }

  /* ===== 下：連絡先（1項目ずつ枠で囲む） ===== */
  .details{flex:0 0 auto;display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .chip{
    display:flex;align-items:center;gap:8px;text-decoration:none;min-width:0;
    padding:6px 9px;border:2px solid var(--main);border-radius:12px;
    background:rgba(255,255,255,.88);box-shadow:0 3px 9px color-mix(in srgb,var(--main-d) 12%,transparent);
    -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
    transition:transform .06s ease;
  }
  a.chip:active{transform:scale(.98)}
  .chip.full{grid-column:1 / -1}
  .chip .ic{
    flex:0 0 28px;width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,var(--main),var(--main-d));
  }
  .chip .ic svg{width:16px;height:16px}
  .chip .ic.line{background:var(--line)}
  .chip .ic.instagram{background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
  .chip .ic.tiktok{background:#111}
  .chip .tx{display:flex;flex-direction:column;line-height:1.18;text-align:left;min-width:0}
  .chip .tx small{font-size:8.5px;font-weight:800;letter-spacing:.1em;color:var(--main-d)}
  .chip .tx b{font-size:12.5px;color:var(--ink);font-weight:700;overflow-wrap:anywhere}
  .chip.address .tx b{font-size:11.5px;line-height:1.25}
  .chip.tel .tx b{font-size:18px;letter-spacing:.02em}
  .chip .arrow{margin-left:auto;flex:0 0 auto;color:var(--main-d);font-size:22px;font-weight:700;line-height:1;padding-left:4px}
  .foot{margin-top:12px;text-align:center;font-size:9px;letter-spacing:.08em;color:var(--sub)}
</style>
</head>
